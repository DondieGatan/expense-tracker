services:
  - type: web
    name: expense-tracker-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SQL_SERVER
        sync: false
      - key: SQL_DATABASE
        sync: false
      - key: SQL_USERNAME
        sync: false
      - key: SQL_PASSWORD
        sync: false
      - key: SQL_TRUSTED_CONNECTION
        value: "no"
      - key: SQL_DRIVER
        value: "ODBC Driver 18 for SQL Server"
      # Optional: powers the written parts of the AI features (magic add, coach wording, ask). Without it every AI
      # feature still works through its rule-based path.
      - key: GEMINI_API_KEY
        sync: false
